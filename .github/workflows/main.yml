name: Build Mod (Java 17 Gradle)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 获取你的源码 (升级到 v4)
    - uses: actions/checkout@v4

    # 2. 强制使用 Java 17 环境 (升级到 v4，并使用 zulu 避开服务器宕机)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. 赋予 gradlew 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 无视证书拦截并执行构建
    - name: Build with Gradle
      run: ./gradlew build -Dnet.minecraftforge.gradle.check.certs=false --no-daemon

    # 5. 将编译好的 .jar 文件打包提供给你下载 (升级到 v4)
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Apotheosis-Ragnarok-Fixed-Mod
        path: build/libs/*.jar
