name: Build Mod (Java 17 Gradle)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 获取代码
    - uses: actions/checkout@v4

    # 2. 强制使用 Java 17 与 Zulu
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. 【核心修复】召唤官方 Gradle 环境，彻底抛弃缺失的 gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    # 4. 直接使用原生 gradle 命令进行编译
    - name: Build with Gradle
      run: gradle build -Dnet.minecraftforge.gradle.check.certs=false --no-daemon

    # 5. 上传最终的 .jar 文件供你下载
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Apotheosis-Ragnarok-Fixed-Mod
        path: build/libs/*.jar
